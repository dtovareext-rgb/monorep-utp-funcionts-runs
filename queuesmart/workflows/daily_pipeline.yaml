# =============================================================================
# Cloud Workflows — Pipeline diario QueeSmart
# =============================================================================
#
# Orquesta:
#   1) Job S3→GCS (prepare + worker)          [omitible: skip_ingest=true]
#   2) SP consolidate + backfill tickets
#   3) STT: init → loop batch(offset) → prd   [checkpoint por tiempo como SA125]
#   4) SP analisis Gemini
#   5) SP resumen final por asesor
#
# Args opcionales:
#   process_date, skip_ingest, skip_init, start_offset, batch_size
#   max_runtime_seconds (default 10800), batch_time_budget_seconds (default 1800)
#   invoke_downstream_sps (default true)
#
# Reanudar STT tras backendError (ej. 2026-11-17):
#   {"process_date":"2026-11-17","skip_ingest":true,"skip_init":true,"start_offset":NNN}
#
# Despliegue / run / scheduler: ver queuesmart/docs/guia-workflow-otra-pc.txt
# =============================================================================

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${default(map.get(args, "project_id"), "prd-utpbi-data-operation")}
          - location: ${default(map.get(args, "location"), "us-central1")}
          - workflow_location: ${default(map.get(args, "workflow_location"), "us-central1")}
          - workflow_id: ${default(map.get(args, "workflow_id"), "queuesmart-daily-pipeline")}
          - bq_location: ${default(map.get(args, "bq_location"), "US")}
          - job_name: ${default(map.get(args, "job_name"), "prd-utpbi-s3-to-gcs-micro-batch")}
          - gcs_bucket: ${default(map.get(args, "gcs_bucket"), "prd-utp-stg-queuesmart")}
          - manifest_prefix: ${default(map.get(args, "manifest_prefix"), "state/manifests")}
          # -1 = no bloquear SPs por tasks fallidas (el worker cataloga el original si FLAC falla).
          # >= 0 = umbral duro (0 = cualquier fallo para el pipeline).
          - max_failed_tasks: ${default(map.get(args, "max_failed_tasks"), -1)}
          # true = consolidate + gen_ia + analisis
          - invoke_downstream_sps: ${default(map.get(args, "invoke_downstream_sps"), true)}
          - skip_ingest: ${default(map.get(args, "skip_ingest"), false)}
          - skip_init: ${default(map.get(args, "skip_init"), false)}
          - start_offset: ${int(default(map.get(args, "start_offset"), 0))}
          - batch_size: ${int(default(map.get(args, "batch_size"), 25))}
          - max_runtime_seconds: ${int(default(map.get(args, "max_runtime_seconds"), 10800))}
          - batch_time_budget_seconds: ${int(default(map.get(args, "batch_time_budget_seconds"), 1800))}
          - process_date: ${default(map.get(args, "process_date"), null)}
          - started_at: ${sys.now()}
          - pipeline_ok: true
          - batches_ok: 0
          - continued: false
          - continue_execution_name: null
          - ia_count: 0
          - offset: 0
          - ingest_summary: {}
          - sp_results: {}

    # process_date = ayer America/Lima si no viene en args
    - resolve_process_date:
        switch:
          - condition: ${process_date != null}
            next: log_start
          - condition: true
            steps:
              - compute_yesterday:
                  assign:
                    # Lima = UTC-5 (sin DST). sys.now()-18000 ≈ reloj Lima; -86400 = ayer calendario.
                    # Ej: 18-ago 02:00 Lima → process_date = 2026-08-17
                    - process_date: ${text.substring(time.format(sys.now() - 104400), 0, 10)}

    - log_start:
        call: sys.log
        args:
          severity: INFO
          text: '${"queuesmart pipeline START process_date=" + process_date + " job=" + job_name + " skip_ingest=" + string(skip_ingest) + " start_offset=" + string(start_offset) + " max_runtime_s=" + string(max_runtime_seconds)}'

    - maybe_skip_ingest:
        switch:
          - condition: ${skip_ingest == true}
            next: maybe_downstream
          - condition: true
            next: run_prepare_job

    # -------------------------------------------------------------------------
    # 1) PREPARE: 1 task genera manifiesto del día en GCS
    # El conector jobs.run espera a que termine la ejecución y devuelve el Execution.
    # No hace falta poll aparte (metadata.name es ID corto y el get fallaba con 404).
    # -------------------------------------------------------------------------
    - run_prepare_job:
        call: googleapis.run.v1.namespaces.jobs.run
        args:
          name: '${"namespaces/" + project_id + "/jobs/" + job_name}'
          location: ${location}
          body:
            overrides:
              taskCount: 1
              containerOverrides:
                - env:
                    - name: QS_JOB_ROLE
                      value: prepare
                    - name: SYNC_PROCESS_DATE
                      value: ${process_date}
                    - name: SYNC_TARGET_DATE
                      value: ${process_date}
          connector_params:
            timeout: 3600
        result: prepare_status

    # Si el conector devolvió un Operation LRO, el Execution viene en .response
    - normalize_prepare:
        assign:
          - prepare_exec: ${default(map.get(prepare_status, "response"), prepare_status)}
          - prepare_st: ${default(map.get(prepare_exec, "status"), json.decode("{}"))}
          - prepare_failed: ${int(default(map.get(prepare_st, "failedCount"), 0))}
          - prepare_succeeded: ${int(default(map.get(prepare_st, "succeededCount"), 0))}
          - prepare_name: ${default(map.get(default(map.get(prepare_exec, "metadata"), json.decode("{}")), "name"), "n/a")}

    - log_prepare_done:
        call: sys.log
        args:
          severity: INFO
          text: '${"PREPARE done name=" + string(prepare_name) + " failed=" + string(prepare_failed) + " succeeded=" + string(prepare_succeeded)}'

    - validate_prepare:
        switch:
          - condition: ${prepare_failed > 0}
            steps:
              - prepare_failed_log:
                  call: sys.log
                  args:
                    severity: ERROR
                    text: '${"PREPARE falló failedCount=" + string(prepare_failed)}'
              - raise_prepare:
                  raise:
                    message: "Cloud Run Job prepare falló"
                    failedCount: ${prepare_failed}
          - condition: true
            next: read_manifest_meta

    # -------------------------------------------------------------------------
    # 2) Leer meta del manifiesto (count) desde GCS
    # -------------------------------------------------------------------------
    - read_manifest_meta:
        call: http.get
        args:
          url: '${"https://storage.googleapis.com/storage/v1/b/" + gcs_bucket + "/o/" + text.url_encode(manifest_prefix + "/" + process_date + ".meta.json") + "?alt=media"}'
          auth:
            type: OAuth2
        result: meta_http

    - parse_manifest_meta:
        assign:
          # http.get ya parsea JSON → body es dict (no string)
          - manifest_meta: ${meta_http.body}
          - manifest_count: ${int(default(map.get(manifest_meta, "count"), 0))}

    - log_manifest:
        call: sys.log
        args:
          severity: INFO
          text: '${"Manifiesto count=" + string(manifest_count) + " process_date=" + string(process_date)}'

    - maybe_skip_worker:
        switch:
          - condition: ${manifest_count == 0}
            steps:
              - log_empty:
                  call: sys.log
                  args:
                    severity: WARNING
                    text: "Manifiesto vacío — no hay archivos; se omite worker e igual se intenta SPs (idempotentes)"
              - assign_empty_ingest:
                  assign:
                    - ingest_summary:
                        manifest_count: 0
                        succeededCount: 0
                        failedCount: 0
                        completionCount: 0
                    - worker_skipped: true
              - after_ingest:
                  next: maybe_run_sps
          - condition: true
            assign:
              - worker_skipped: false
            next: run_worker_job

    # -------------------------------------------------------------------------
    # 3) WORKER: N tasks en paralelo (1 archivo por task)
    # jobs.run espera el fin de TODAS las tasks.
    # Si alguna task falla, el conector lanza OperationError y NUNCA devolvía
    # el Execution → no se evaluaba max_failed_tasks. Se captura y se sigue
    # a normalize_worker / gate_on_failures.
    # -------------------------------------------------------------------------
    - run_worker_job:
        try:
          steps:
            - call_worker:
                call: googleapis.run.v1.namespaces.jobs.run
                args:
                  name: '${"namespaces/" + project_id + "/jobs/" + job_name}'
                  location: ${location}
                  body:
                    overrides:
                      taskCount: ${manifest_count}
                      containerOverrides:
                        - env:
                            - name: QS_JOB_ROLE
                              value: worker
                            - name: SYNC_PROCESS_DATE
                              value: ${process_date}
                            - name: SYNC_TARGET_DATE
                              value: ${process_date}
                  connector_params:
                    timeout: 14400
                result: worker_status
            - mark_worker_connector_ok:
                assign:
                  - worker_connector_ok: true
        except:
          as: worker_err
          steps:
            - log_worker_connector_err:
                call: sys.log
                args:
                  severity: WARNING
                  text: '${"WORKER jobs.run OperationError (se evalúa failedCount): " + string(default(map.get(worker_err, "message"), "n/a"))}'
            - assign_worker_from_err:
                assign:
                  - worker_connector_ok: false
                  - worker_status: ${default(map.get(worker_err, "operation"), worker_err)}

    - normalize_worker:
        assign:
          - worker_exec: ${default(map.get(worker_status, "response"), worker_status)}
          - worker_st: ${default(map.get(worker_exec, "status"), json.decode("{}"))}
          - succeeded_count: ${int(default(map.get(worker_st, "succeededCount"), 0))}
          - failed_count: ${int(default(map.get(worker_st, "failedCount"), 0))}
          - completion_count: ${int(default(map.get(worker_st, "completionCount"), succeeded_count + failed_count))}
          - worker_name: ${default(map.get(default(map.get(worker_exec, "metadata"), json.decode("{}")), "name"), "")}
          - ingest_summary:
              manifest_count: ${manifest_count}
              succeededCount: ${succeeded_count}
              failedCount: ${failed_count}
              completionCount: ${completion_count}
              execution: ${worker_name}

    - log_worker_raw:
        call: sys.log
        args:
          severity: INFO
          text: '${"WORKER done name=" + string(default(worker_name, "n/a")) + " failed=" + string(failed_count) + " succeeded=" + string(succeeded_count)}'

    - log_worker_result:
        switch:
          - condition: ${max_failed_tasks >= 0 and failed_count > max_failed_tasks}
            steps:
              - log_worker_err:
                  call: sys.log
                  args:
                    severity: ERROR
                    text: '${"WORKER done succeeded=" + string(succeeded_count) + " failed=" + string(failed_count) + " of " + string(manifest_count)}'
          - condition: true
            steps:
              - log_worker_ok:
                  call: sys.log
                  args:
                    severity: INFO
                    text: '${"WORKER done succeeded=" + string(succeeded_count) + " failed=" + string(failed_count) + " of " + string(manifest_count)}'

    - gate_on_failures:
        switch:
          - condition: ${not(default(worker_connector_ok, true)) and failed_count == 0 and succeeded_count == 0}
            steps:
              - raise_worker_unknown:
                  raise:
                    message: "Worker falló sin failedCount en el error del conector"
                    error: ${default(worker_status, "n/a")}
          - condition: ${max_failed_tasks >= 0 and failed_count > max_failed_tasks}
            steps:
              - block_sps:
                  call: sys.log
                  args:
                    severity: ERROR
                    text: '${"Ingesta incompleta — NO se ejecutan SPs. failed=" + string(failed_count) + " max_allowed=" + string(max_failed_tasks)}'
              - raise_ingest:
                  raise:
                    message: "Ingesta parcial: SPs bloqueados"
                    ingest: ${ingest_summary}
          - condition: ${failed_count > 0}
            steps:
              - warn_partial:
                  call: sys.log
                  args:
                    severity: WARNING
                    text: '${"WORKER parcial failed=" + string(failed_count) + " succeeded=" + string(succeeded_count) + " — se continúa a SPs (original catalogado si FLAC falló)"}'
              - continue_partial:
                  next: maybe_run_sps
          - condition: true
            next: maybe_run_sps

    # -------------------------------------------------------------------------
    # 4) SP consolidate (siempre, si llegó aquí)
    # -------------------------------------------------------------------------
    - maybe_run_sps:
        next: sp_consolidate

    - sp_consolidate:
        steps:
          - log_sp1_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_mp3_consolidate(" + process_date + ")"}'
          - call_sp1:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".raw_queue_smart.sp_queuesmart_mp3_consolidate`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart
                    etapa: consolidate
                    servicio: bq
                    pipeline: queuesmart-daily
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 3600
              result: sp1_job
          - wait_sp1:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp1:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp1_job.jobReference.jobId}
                location: ${bq_location}
              result: sp1_status
          - check_sp1:
              switch:
                - condition: ${sp1_status.status.state == "DONE"}
                  next: sp1_done_check
                - condition: true
                  steps:
                    - sleep_sp1:
                        call: sys.sleep
                        args:
                          seconds: 10
                    - loop_sp1:
                        next: poll_sp1
          - sp1_done_check:
              switch:
                - condition: ${"errorResult" in sp1_status.status}
                  steps:
                    - log_sp1_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"SP consolidate FAILED: " + string(default(map.get(map.get(sp1_status, "status"), "errorResult"), "unknown"))}'
                    - raise_sp1:
                        raise:
                          message: "sp_queuesmart_mp3_consolidate falló"
                          error: ${sp1_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp1_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP consolidate OK"
                    - mark_sp1:
                        assign:
                          - sp_results["consolidate"]: "ok"

    # -------------------------------------------------------------------------
    # 4b) SP backfill tickets tardíos (después de consolidate; sin CALL anidado)
    # -------------------------------------------------------------------------
    - sp_backfill_tickets:
        steps:
          - log_sp1b_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_mp3_backfill_tickets(" + process_date + ")"}'
          - call_sp1b:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".raw_queue_smart.sp_queuesmart_mp3_backfill_tickets`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart
                    etapa: backfill-tickets
                    servicio: bq
                    pipeline: queuesmart-daily
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 3600
              result: sp1b_job
          - wait_sp1b:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp1b:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp1b_job.jobReference.jobId}
                location: ${bq_location}
              result: sp1b_status
          - check_sp1b:
              switch:
                - condition: ${sp1b_status.status.state == "DONE"}
                  next: sp1b_done_check
                - condition: true
                  steps:
                    - sleep_sp1b:
                        call: sys.sleep
                        args:
                          seconds: 10
                    - loop_sp1b:
                        next: poll_sp1b
          - sp1b_done_check:
              switch:
                - condition: ${"errorResult" in sp1b_status.status}
                  steps:
                    - log_sp1b_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"SP backfill_tickets FAILED: " + string(default(map.get(map.get(sp1b_status, "status"), "errorResult"), "unknown"))}'
                    - raise_sp1b:
                        raise:
                          message: "sp_queuesmart_mp3_backfill_tickets falló"
                          error: ${sp1b_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp1b_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP backfill_tickets OK"
                    - mark_sp1b:
                        assign:
                          - sp_results["backfill_tickets"]: "ok"

    - maybe_downstream:
        switch:
          - condition: ${invoke_downstream_sps == false}
            next: finalize
          - condition: true
            next: sp_transcribe

    # -------------------------------------------------------------------------
    # 5) STT — init → loop batch → prd (checkpoint por tiempo = SA125)
    # -------------------------------------------------------------------------
    - sp_transcribe:
        next: stt_maybe_init

    - stt_maybe_init:
        switch:
          - condition: ${skip_init == true}
            steps:
              - call_init_skip_delete:
                  call: googleapis.bigquery.v2.jobs.insert
                  args:
                    projectId: ${project_id}
                    body:
                      labels:
                        producto: queuesmart
                        etapa: stt
                        sp: gen_ia_init
                        pipeline: queuesmart-daily
                      configuration:
                        query:
                          query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_mp3_gen_ia_init`(DATE ''" + process_date + "'', TRUE);"}'
                          useLegacySql: false
                          priority: INTERACTIVE
                      jobReference:
                        location: ${bq_location}
                    connector_params:
                      timeout: 600
                  result: stt_init_job
              - goto_poll_init_skip:
                  next: wait_stt_init
          - condition: true
            steps:
              - log_stt_init:
                  call: sys.log
                  args:
                    severity: INFO
                    text: '${"SP start: sp_queuesmart_mp3_gen_ia_init(" + process_date + ", skip_delete=false)"}'
              - call_init_full:
                  call: googleapis.bigquery.v2.jobs.insert
                  args:
                    projectId: ${project_id}
                    body:
                      labels:
                        producto: queuesmart
                        etapa: stt
                        sp: gen_ia_init
                        pipeline: queuesmart-daily
                      configuration:
                        query:
                          query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_mp3_gen_ia_init`(DATE ''" + process_date + "'', FALSE);"}'
                          useLegacySql: false
                          priority: INTERACTIVE
                      jobReference:
                        location: ${bq_location}
                    connector_params:
                      timeout: 600
                  result: stt_init_job
              - goto_poll_init:
                  next: wait_stt_init

    - wait_stt_init:
        call: sys.sleep
        args:
          seconds: 3

    - poll_stt_init:
        call: googleapis.bigquery.v2.jobs.get
        args:
          projectId: ${project_id}
          jobId: ${stt_init_job.jobReference.jobId}
          location: ${bq_location}
        result: stt_init_status

    - check_stt_init:
        switch:
          - condition: ${stt_init_status.status.state == "DONE"}
            next: stt_init_done
          - condition: true
            steps:
              - sleep_stt_init:
                  call: sys.sleep
                  args:
                    seconds: 5
              - loop_stt_init:
                  next: poll_stt_init

    - stt_init_done:
        switch:
          - condition: ${"errorResult" in stt_init_status.status}
            steps:
              - raise_stt_init:
                  raise:
                    message: "sp_queuesmart_mp3_gen_ia_init falló"
                    error: ${stt_init_status.status.errorResult}
          - condition: true
            next: count_stt

    - count_stt:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: '${"SELECT COUNT(*) AS n FROM `" + project_id + ".adf_speech_analytics.stg_queuesmart_mp3_stt_candidates` WHERE process_date = DATE ''" + process_date + "''"}'
            useLegacySql: false
            location: ${bq_location}
            timeoutMs: 60000
            labels:
              producto: queuesmart
              etapa: stt
              sp: count
        result: count_stt_job

    - parse_stt_count:
        assign:
          - ia_count: ${int(count_stt_job.rows[0].f[0].v)}
          - offset: ${start_offset}

    - log_stt_count:
        call: sys.log
        args:
          severity: INFO
          text: '${"STT candidatos=" + string(ia_count) + " start_offset=" + string(offset) + " batch_size=" + string(batch_size)}'

    - maybe_skip_stt:
        switch:
          - condition: ${ia_count == 0}
            steps:
              - mark_stt_empty:
                  assign:
                    - sp_results["gen_ia"]: "skipped_empty"
              - skip_stt_to_gemini:
                  next: sp_gemini
          - condition: true
            next: loop_stt_batches

    - loop_stt_batches:
        switch:
          - condition: ${offset < ia_count}
            next: maybe_stt_checkpoint
          - condition: true
            next: stt_prd

    - maybe_stt_checkpoint:
        switch:
          - condition: ${sys.now() - started_at >= max_runtime_seconds - batch_time_budget_seconds}
            next: stt_checkpoint_continue
          - condition: true
            next: stt_batch

    - stt_checkpoint_continue:
        steps:
          - log_stt_checkpoint:
              call: sys.log
              args:
                severity: WARNING
                text: '${"QueeSmart STT checkpoint: elapsed_s=" + string(sys.now() - started_at) + " offset=" + string(offset) + "/" + string(ia_count)}'
          - build_stt_continue_args:
              assign:
                - continue_args:
                    process_date: ${process_date}
                    skip_ingest: true
                    skip_init: true
                    start_offset: ${offset}
                    batch_size: ${batch_size}
                    max_runtime_seconds: ${max_runtime_seconds}
                    batch_time_budget_seconds: ${batch_time_budget_seconds}
                    invoke_downstream_sps: true
                    project_id: ${project_id}
                    bq_location: ${bq_location}
          - spawn_stt_continue:
              call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.create
              args:
                parent: ${"projects/" + project_id + "/locations/" + workflow_location + "/workflows/" + workflow_id}
                body:
                  argument: ${json.encode_to_string(continue_args)}
              result: continue_exec
          - mark_stt_continued:
              assign:
                - continued: true
                - continue_execution_name: ${continue_exec.name}
                - sp_results["gen_ia"]: "continued"
                - sp_results["continued_at_offset"]: ${offset}
                - sp_results["continue_execution"]: ${continue_exec.name}
          - end_stt_for_continue:
              next: finalize

    - stt_batch:
        steps:
          - log_stt_batch:
              call: sys.log
              args:
                severity: INFO
                text: '${"STT batch offset=" + string(offset) + " size=" + string(batch_size) + " of " + string(ia_count)}'
          - call_stt_batch:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    producto: queuesmart
                    etapa: stt
                    sp: gen_ia_batch
                    pipeline: queuesmart-daily
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_mp3_gen_ia_batch`(DATE ''" + process_date + "'', " + string(offset) + ", " + string(batch_size) + ");"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 7200
              result: stt_batch_job
          - wait_stt_batch:
              call: sys.sleep
              args:
                seconds: 5
          - poll_stt_batch:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${stt_batch_job.jobReference.jobId}
                location: ${bq_location}
              result: stt_batch_status
          - check_stt_batch:
              switch:
                - condition: ${stt_batch_status.status.state == "DONE"}
                  next: stt_batch_done
                - condition: true
                  steps:
                    - sleep_stt_batch:
                        call: sys.sleep
                        args:
                          seconds: 15
                    - loop_poll_stt_batch:
                        next: poll_stt_batch
          - stt_batch_done:
              switch:
                - condition: ${"errorResult" in stt_batch_status.status}
                  steps:
                    - log_stt_batch_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"STT batch FAILED offset=" + string(offset) + " — reanudar skip_ingest+skip_init start_offset=" + string(offset)}'
                    - raise_stt_batch:
                        raise:
                          message: "sp_queuesmart_mp3_gen_ia_batch falló"
                          offset: ${offset}
                          error: ${stt_batch_status.status.errorResult}
                - condition: true
                  steps:
                    - bump_stt_offset:
                        assign:
                          - offset: ${offset + batch_size}
                          - batches_ok: ${batches_ok + 1}
                    - next_stt_batch:
                        next: loop_stt_batches

    - stt_prd:
        steps:
          - log_stt_prd:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_mp3_gen_ia_prd(" + process_date + ")"}'
          - call_stt_prd:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    producto: queuesmart
                    etapa: stt
                    sp: gen_ia_prd
                    pipeline: queuesmart-daily
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_mp3_gen_ia_prd`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 3600
              result: stt_prd_job
          - wait_stt_prd:
              call: sys.sleep
              args:
                seconds: 5
          - poll_stt_prd:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${stt_prd_job.jobReference.jobId}
                location: ${bq_location}
              result: stt_prd_status
          - check_stt_prd:
              switch:
                - condition: ${stt_prd_status.status.state == "DONE"}
                  next: stt_prd_done
                - condition: true
                  steps:
                    - sleep_stt_prd:
                        call: sys.sleep
                        args:
                          seconds: 10
                    - loop_stt_prd:
                        next: poll_stt_prd
          - stt_prd_done:
              switch:
                - condition: ${"errorResult" in stt_prd_status.status}
                  steps:
                    - raise_stt_prd:
                        raise:
                          message: "sp_queuesmart_mp3_gen_ia_prd falló"
                          error: ${stt_prd_status.status.errorResult}
                - condition: true
                  steps:
                    - mark_stt_ok:
                        assign:
                          - sp_results["gen_ia"]: "ok"
                          - sp_results["stt_batches_ok"]: ${batches_ok}

    # -------------------------------------------------------------------------
    # 6) SP analisis Gemini
    # -------------------------------------------------------------------------
    - sp_gemini:
        steps:
          - log_sp3_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_audio_analisis_ia(" + process_date + ")"}'
          - call_sp3:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_audio_analisis_ia`(DATE ''" + process_date + "'', NULL);"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart
                    etapa: gemini
                    servicio: flash-3-5
                    pipeline: queuesmart-daily
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 14400
              result: sp3_job
          - wait_sp3:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp3:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp3_job.jobReference.jobId}
                location: ${bq_location}
              result: sp3_status
          - check_sp3:
              switch:
                - condition: ${sp3_status.status.state == "DONE"}
                  next: sp3_done_check
                - condition: true
                  steps:
                    - sleep_sp3:
                        call: sys.sleep
                        args:
                          seconds: 15
                    - loop_sp3:
                        next: poll_sp3
          - sp3_done_check:
              switch:
                - condition: ${"errorResult" in sp3_status.status}
                  steps:
                    - log_sp3_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"SP analisis FAILED: " + string(default(map.get(map.get(sp3_status, "status"), "errorResult"), "unknown"))}'
                    - raise_sp3:
                        raise:
                          message: "sp_queuesmart_audio_analisis_ia falló"
                          error: ${sp3_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp3_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP analisis (Gemini) OK"
                    - mark_sp3:
                        assign:
                          - sp_results["analisis"]: "ok"

    # -------------------------------------------------------------------------
    # 6) SP resumen final por asesor (Gemini sobre hist análisis del día)
    # -------------------------------------------------------------------------
    - sp_resumen_final:
        steps:
          - log_sp4_start:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_queuesmart_counter_resumen_final(" + process_date + ")"}'
          - call_sp4:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_queuesmart_counter_resumen_final`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  labels:
                    producto: queuesmart
                    etapa: resumen-final
                    servicio: flash-3-5
                    pipeline: queuesmart-daily
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 14400
              result: sp4_job
          - wait_sp4:
              call: sys.sleep
              args:
                seconds: 5
          - poll_sp4:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${sp4_job.jobReference.jobId}
                location: ${bq_location}
              result: sp4_status
          - check_sp4:
              switch:
                - condition: ${sp4_status.status.state == "DONE"}
                  next: sp4_done_check
                - condition: true
                  steps:
                    - sleep_sp4:
                        call: sys.sleep
                        args:
                          seconds: 15
                    - loop_sp4:
                        next: poll_sp4
          - sp4_done_check:
              switch:
                - condition: ${"errorResult" in sp4_status.status}
                  steps:
                    - log_sp4_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"SP resumen_final FAILED: " + string(default(map.get(map.get(sp4_status, "status"), "errorResult"), "unknown"))}'
                    - raise_sp4:
                        raise:
                          message: "sp_queuesmart_counter_resumen_final falló"
                          error: ${sp4_status.status.errorResult}
                - condition: true
                  steps:
                    - log_sp4_ok:
                        call: sys.log
                        args:
                          severity: INFO
                          text: "SP resumen_final (Counter) OK"
                    - mark_sp4:
                        assign:
                          - sp_results["resumen_final"]: "ok"

    # -------------------------------------------------------------------------
    # 7) Cierre
    # -------------------------------------------------------------------------
    - finalize:
        assign:
          - ended_at: ${sys.now()}
          - elapsed_seconds: ${ended_at - started_at}
          - summary:
              process_date: ${process_date}
              ingest: ${ingest_summary}
              sps: ${sp_results}
              invoke_downstream_sps: ${invoke_downstream_sps}
              stt_count: ${ia_count}
              stt_batches_ok: ${batches_ok}
              continued: ${continued}
              continue_execution: ${continue_execution_name}
              next_offset: ${offset}
              elapsed_seconds: ${elapsed_seconds}

    - log_summary:
        call: sys.log
        args:
          severity: INFO
          text: '${"queuesmart pipeline END process_date=" + string(process_date) + " continued=" + string(continued) + " next_offset=" + string(offset) + " elapsed_s=" + string(elapsed_seconds)}'

    - return_summary:
        return: ${summary}

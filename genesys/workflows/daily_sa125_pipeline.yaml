# =============================================================================
# Cloud Workflows — Pipeline diario Speech Analytics 125 (prompt Paul)
#
# Prerrequisito: genesys_audios_serialize_markov del process_date ya cargado
#   (cr_serialize_markov / pipeline Markov previo).
#
# 1) COUNT candidatos (serialize con transcripción)
# 2) init: DELETE RAW del día
# 3) loop: batch(offset, batch_size) — AI.GENERATE_TABLE → RAW
# 4) parse: RAW → PRD
# 5) flatten: PRD → hist_speech_analytics_125_flat_prd (+ CRM/tipif)
#
# Args opcionales:
#   process_date              YYYY-MM-DD (default: ayer America/Lima)
#   batch_size                default 20
#   start_offset              default 0 (reproceso desde un lote)
#   skip_init                 true = no borrar RAW del día (reanudar)
#   max_runtime_seconds       default 10800 (3h) — presupuesto de esta ejecución
#   batch_time_budget_seconds default 1800 — no arranca otro batch si queda menos
#
# Checkpoint por tiempo: antes de cada batch, si
#   elapsed >= max_runtime - batch_budget, lanza un workflow hijo con
#   start_offset=offset, skip_init=true y termina OK (sin matar un batch a medias).
#
# Deploy:
#   gcloud workflows deploy genesys-sa125-daily \
#     --location=us-central1 \
#     --source=genesys/workflows/daily_sa125_pipeline.yaml \
#     --project=prd-utpbi-data-operation \
#     --service-account=genesys-audio-processor@prd-utpbi-data-operation.iam.gserviceaccount.com
#
# Run:
#   gcloud workflows run genesys-sa125-daily --location=us-central1 --data='{}'
#   gcloud workflows run genesys-sa125-daily --location=us-central1 \
#     --data='{"process_date":"2026-11-02","batch_size":20}'
#
# Reanudar si falló el lote offset=40:
#   {"process_date":"2026-11-02","start_offset":40,"skip_init":true}
#
# Scheduler (después de serialize; 04:00 America/Lima → procesa ayer):
#   gcloud scheduler jobs create http prd-sch-genesys-sa125-daily \
#     --project=prd-utpbi-data-operation \
#     --location=us-central1 \
#     --schedule="0 4 * * *" \
#     --time-zone="America/Lima" \
#     --uri="https://workflowexecutions.googleapis.com/v1/projects/prd-utpbi-data-operation/locations/us-central1/workflows/genesys-sa125-daily/executions" \
#     --http-method=POST \
#     --oauth-service-account-email=genesys-audio-processor@prd-utpbi-data-operation.iam.gserviceaccount.com \
#     --message-body='{}'
# =============================================================================

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: ${default(map.get(args, "project_id"), "prd-utpbi-data-operation")}
          - workflow_location: ${default(map.get(args, "workflow_location"), "us-central1")}
          - workflow_id: ${default(map.get(args, "workflow_id"), "genesys-sa125-daily")}
          - bq_location: ${default(map.get(args, "bq_location"), "US")}
          - batch_size: ${int(default(map.get(args, "batch_size"), 20))}
          - start_offset: ${int(default(map.get(args, "start_offset"), 0))}
          - skip_init: ${default(map.get(args, "skip_init"), false)}
          - process_date: ${default(map.get(args, "process_date"), null)}
          # Presupuesto de esta ejecución; deja margen para 1 batch Gemini (~30m)
          - max_runtime_seconds: ${int(default(map.get(args, "max_runtime_seconds"), 10800))}
          - batch_time_budget_seconds: ${int(default(map.get(args, "batch_time_budget_seconds"), 1800))}
          - started_at: ${sys.now()}
          - batches_ok: 0
          - continued: false
          - continue_execution_name: null
          - sp_results: {}

    - resolve_process_date:
        switch:
          - condition: ${process_date != null}
            next: log_start
          - condition: true
            steps:
              - compute_yesterday:
                  assign:
                    # Lima = UTC-5. sys.now()-18000 ≈ Lima; -86400 = ayer.
                    - process_date: ${text.substring(time.format(sys.now() - 104400), 0, 10)}

    - log_start:
        call: sys.log
        args:
          severity: INFO
          text: '${"genesys sa125 START process_date=" + process_date + " batch_size=" + string(batch_size) + " start_offset=" + string(start_offset) + " max_runtime_s=" + string(max_runtime_seconds) + " batch_budget_s=" + string(batch_time_budget_seconds)}'

    - count_ia:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project_id}
          body:
            query: '${"SELECT COUNT(*) AS n FROM `" + project_id + ".raw_genesys_audios.genesys_audios_serialize_markov` WHERE fecha_descarga = DATE ''" + process_date + "'' AND uri IS NOT NULL AND NULLIF(TRIM(serialized_level_1), '''') IS NOT NULL"}'
            useLegacySql: false
            location: ${bq_location}
            timeoutMs: 60000
            labels:
              pipeline: genesys_sa125
              sp: count_ia
        result: count_job

    - parse_count:
        assign:
          - ia_count: ${int(count_job.rows[0].f[0].v)}

    - log_count:
        call: sys.log
        args:
          severity: INFO
          text: '${"Candidatos SA125 (serialize con tx) = " + string(ia_count) + " process_date=" + process_date}'

    - maybe_skip_ia:
        switch:
          - condition: ${ia_count == 0}
            steps:
              - log_empty:
                  call: sys.log
                  args:
                    severity: WARNING
                    text: "Sin transcripciones serialize — se omite generate y parse"
              - mark_empty:
                  assign:
                    - sp_results["ia"]: "skipped_empty"
              - skip_to_end:
                  next: finalize
          - condition: true
            next: maybe_init

    - maybe_init:
        switch:
          - condition: ${skip_init == true}
            next: init_loop
          - condition: true
            next: sp_init

    - sp_init:
        steps:
          - log_init:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_speech_analytics_125_init(" + process_date + ")"}'
          - call_init:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    pipeline: genesys_sa125
                    sp: sa125_init
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_speech_analytics_125_init`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 600
              result: init_job
          - wait_init:
              call: sys.sleep
              args:
                seconds: 3
          - poll_init:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${init_job.jobReference.jobId}
                location: ${bq_location}
              result: init_status
          - check_init:
              switch:
                - condition: ${init_status.status.state == "DONE"}
                  next: init_done
                - condition: true
                  steps:
                    - sleep_init:
                        call: sys.sleep
                        args:
                          seconds: 5
                    - loop_init:
                        next: poll_init
          - init_done:
              switch:
                - condition: ${"errorResult" in init_status.status}
                  steps:
                    - raise_init:
                        raise:
                          message: "sp_speech_analytics_125_init falló"
                          error: ${init_status.status.errorResult}
                - condition: true
                  steps:
                    - mark_init:
                        assign:
                          - sp_results["init"]: "ok"

    - init_loop:
        assign:
          - offset: ${start_offset}

    - loop_batches:
        switch:
          - condition: ${offset < ia_count}
            next: maybe_checkpoint
          - condition: true
            next: sp_parse

    # Si queda poco tiempo para un batch Gemini, no arranca: spawnea continuación.
    - maybe_checkpoint:
        switch:
          - condition: ${sys.now() - started_at >= max_runtime_seconds - batch_time_budget_seconds}
            next: checkpoint_continue
          - condition: true
            next: sp_batch

    - checkpoint_continue:
        steps:
          - log_checkpoint:
              call: sys.log
              args:
                severity: WARNING
                text: '${"SA125 checkpoint por tiempo: elapsed_s=" + string(sys.now() - started_at) + " offset=" + string(offset) + "/" + string(ia_count) + " — spawneando continuación skip_init"}'
          # Workflows no permite {"k": v} dentro de ${}; armar map en assign.
          - build_continue_args:
              assign:
                - continue_args:
                    process_date: ${process_date}
                    batch_size: ${batch_size}
                    start_offset: ${offset}
                    skip_init: true
                    max_runtime_seconds: ${max_runtime_seconds}
                    batch_time_budget_seconds: ${batch_time_budget_seconds}
                    project_id: ${project_id}
                    bq_location: ${bq_location}
          - spawn_continue:
              call: googleapis.workflowexecutions.v1.projects.locations.workflows.executions.create
              args:
                parent: ${"projects/" + project_id + "/locations/" + workflow_location + "/workflows/" + workflow_id}
                body:
                  argument: ${json.encode_to_string(continue_args)}
              result: continue_exec
          - mark_continued:
              assign:
                - continued: true
                - continue_execution_name: ${continue_exec.name}
                - sp_results["continued_at_offset"]: ${offset}
                - sp_results["continue_execution"]: ${continue_exec.name}
          - log_spawned:
              call: sys.log
              args:
                severity: INFO
                text: '${"SA125 continuación lanzada: " + string(continue_exec.name) + " start_offset=" + string(offset)}'
          - end_for_continue:
              next: finalize

    - sp_batch:
        steps:
          - log_batch:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP batch offset=" + string(offset) + " size=" + string(batch_size) + " of " + string(ia_count)}'
          - call_batch:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    pipeline: genesys_sa125
                    sp: sa125_batch
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_speech_analytics_125_batch`(DATE ''" + process_date + "'', " + string(offset) + ", " + string(batch_size) + ");"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 7200
              result: batch_job
          - wait_batch:
              call: sys.sleep
              args:
                seconds: 5
          - poll_batch:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${batch_job.jobReference.jobId}
                location: ${bq_location}
              result: batch_status
          - check_batch:
              switch:
                - condition: ${batch_status.status.state == "DONE"}
                  next: batch_done
                - condition: true
                  steps:
                    - sleep_batch:
                        call: sys.sleep
                        args:
                          seconds: 15
                    - loop_poll_batch:
                        next: poll_batch
          - batch_done:
              switch:
                - condition: ${"errorResult" in batch_status.status}
                  steps:
                    - log_batch_err:
                        call: sys.log
                        args:
                          severity: ERROR
                          text: '${"SA125 batch FAILED offset=" + string(offset) + " — reanudar con start_offset=" + string(offset) + " skip_init=true"}'
                    - raise_batch:
                        raise:
                          message: "sp_speech_analytics_125_batch falló"
                          offset: ${offset}
                          error: ${batch_status.status.errorResult}
                - condition: true
                  steps:
                    - bump:
                        assign:
                          - offset: ${offset + batch_size}
                          - batches_ok: ${batches_ok + 1}
                          - sp_results["batches_ok"]: ${batches_ok}
                    - next_batch:
                        next: loop_batches

    - sp_parse:
        steps:
          - log_parse:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_speech_analytics_125_parse(" + process_date + ")"}'
          - call_parse:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    pipeline: genesys_sa125
                    sp: sa125_parse
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_speech_analytics_125_parse`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 1800
              result: parse_job
          - wait_parse:
              call: sys.sleep
              args:
                seconds: 3
          - poll_parse:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${parse_job.jobReference.jobId}
                location: ${bq_location}
              result: parse_status
          - check_parse:
              switch:
                - condition: ${parse_status.status.state == "DONE"}
                  next: parse_done
                - condition: true
                  steps:
                    - sleep_parse:
                        call: sys.sleep
                        args:
                          seconds: 8
                    - loop_parse:
                        next: poll_parse
          - parse_done:
              switch:
                - condition: ${"errorResult" in parse_status.status}
                  steps:
                    - raise_parse:
                        raise:
                          message: "sp_speech_analytics_125_parse falló"
                          error: ${parse_status.status.errorResult}
                - condition: true
                  steps:
                    - mark_parse:
                        assign:
                          - sp_results["parse"]: "ok"
                    - goto_flatten:
                        next: sp_flatten

    # -------------------------------------------------------------------------
    # 5) Flatten PRD → hist_speech_analytics_125_flat_prd
    # -------------------------------------------------------------------------
    - sp_flatten:
        steps:
          - log_flatten:
              call: sys.log
              args:
                severity: INFO
                text: '${"SP start: sp_speech_analytics_125_flatten(" + process_date + ")"}'
          - call_flatten:
              call: googleapis.bigquery.v2.jobs.insert
              args:
                projectId: ${project_id}
                body:
                  labels:
                    pipeline: genesys_sa125
                    sp: sa125_flatten
                  configuration:
                    query:
                      query: '${"CALL `" + project_id + ".adf_speech_analytics.sp_speech_analytics_125_flatten`(DATE ''" + process_date + "'');"}'
                      useLegacySql: false
                      priority: INTERACTIVE
                  jobReference:
                    location: ${bq_location}
                connector_params:
                  timeout: 1800
              result: flatten_job
          - wait_flatten:
              call: sys.sleep
              args:
                seconds: 3
          - poll_flatten:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project_id}
                jobId: ${flatten_job.jobReference.jobId}
                location: ${bq_location}
              result: flatten_status
          - check_flatten:
              switch:
                - condition: ${flatten_status.status.state == "DONE"}
                  next: flatten_done
                - condition: true
                  steps:
                    - sleep_flatten:
                        call: sys.sleep
                        args:
                          seconds: 8
                    - loop_flatten:
                        next: poll_flatten
          - flatten_done:
              switch:
                - condition: ${"errorResult" in flatten_status.status}
                  steps:
                    - raise_flatten:
                        raise:
                          message: "sp_speech_analytics_125_flatten falló"
                          error: ${flatten_status.status.errorResult}
                - condition: true
                  steps:
                    - mark_flatten:
                        assign:
                          - sp_results["flatten"]: "ok"

    - finalize:
        assign:
          - ended_at: ${sys.now()}
          - elapsed_seconds: ${ended_at - started_at}
          - summary:
              process_date: ${process_date}
              ia_count: ${default(ia_count, 0)}
              batch_size: ${batch_size}
              batches_ok: ${batches_ok}
              continued: ${continued}
              continue_execution: ${continue_execution_name}
              next_offset: ${default(offset, start_offset)}
              sps: ${sp_results}
              elapsed_seconds: ${elapsed_seconds}

    - log_summary:
        call: sys.log
        args:
          severity: INFO
          text: '${"genesys sa125 END process_date=" + string(process_date) + " ia_count=" + string(default(ia_count, 0)) + " batches_ok=" + string(batches_ok) + " continued=" + string(continued) + " elapsed_s=" + string(elapsed_seconds)}'

    - return_summary:
        return: ${summary}
